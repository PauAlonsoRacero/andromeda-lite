# ============================================================
# ANDROMEDA — CI/CD Pipeline
# Runs on: push to main/develop, pull requests
# ============================================================

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:

  # ── Backend tests ──────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests (${{ matrix.os }})
    # Andromeda es una app de ESCRITORIO para macOS y Windows, pero el CI solo
    # probaba en Linux. Todos los fallos de empaquetado (Gatekeeper, pyobjc, la
    # app relanzándose sola, las descargas navegando la ventana) aparecieron en
    # la máquina del usuario porque en Linux ni siquiera existen.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false          # que un sistema no cancele los demás
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Versiones conocidas y estables (evita que un pytest muy nuevo rompa plugins)
          pip install "pytest>=8,<9" "pytest-asyncio>=0.23,<0.25" pytest-cov httpx

      - name: Show environment (diagnostics)
        run: |
          python --version
          pip list
          echo "--- pytest ---"
          pytest --version

      # `| tee` no existe en PowerShell: se usa bash explícitamente en los tres
      # sistemas para que el comando sea idéntico en todos.
      - name: Run tests with coverage
        shell: bash
        run: pytest tests/ -v --tb=long --cov=backend/app --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest-output.txt
        env:
          ANDROMEDA_ENVIRONMENT: test
          PYTHONPATH: backend

      - name: Upload test log (for debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-output-${{ matrix.os }}
          path: pytest-output.txt
          if-no-files-found: ignore

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore

  # ── Lint & type check ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install linters
        run: pip install ruff

      - name: Ruff lint
        run: ruff check backend/ --ignore E501,F401,E701,E702,E741,E402 || true
        continue-on-error: true

  # ── Frontend build check ───────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: frontend

      # Vite compila aunque falte un import; el análisis estático lo detecta
      # antes de que llegue a la app ("Can't find variable: PromptCatalog").
      - name: Lint (variables y componentes sin definir)
        run: npm run lint
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

      - name: Check build output
        run: |
          test -d frontend/dist
          test -f frontend/dist/index.html
          echo "✓ Frontend build OK"

  # ── Docker build check ────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v5

      - name: Build backend image
        run: docker build -t andromeda-backend ./backend

      - name: Build frontend image
        run: docker build -t andromeda-frontend ./frontend

      - name: Smoke test backend
        run: |
          docker run -d --name andromeda-backend-test \
            -p 8000:8000 \
            -e ANDROMEDA_ENVIRONMENT=test \
            andromeda-backend
          sleep 5
          curl -f http://localhost:8000/api/health || echo "Backend not ready (Ollama required)"
          docker stop andromeda-backend-test

  # ── Escaneo de seguridad de dependencias ───────────────────────────────────
  security:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt || true   # informativo de momento

      # Las dependencias del frontend no se auditaban: una vulnerabilidad alta
      # en axios pasó desapercibida hasta una revisión manual.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: npm audit
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high || true   # informativo
      - name: Bandit (análisis estático de seguridad)
        run: |
          pip install bandit
          bandit -ll -r backend/app -q || true   # medio/alto; informativo

  # ── Validación de manifiestos Kubernetes ───────────────────────────────────
  k8s-validate:
    name: Validate K8s manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar xz && sudo mv kubeconform /usr/local/bin/
      - name: Validate manifests
        run: kubeconform -summary -ignore-missing-schemas deploy/k8s/

  # ── Summary ───────────────────────────────────────────────────────────────
  # ── Empaquetado de escritorio ──────────────────────────────────────────────
  # Verifica que PyInstaller produce un ejecutable en macOS y Windows. No firma
  # ni publica nada: solo comprueba que el build no revienta, que es justo lo
  # que fallaba y solo se descubría al intentar generar la app a mano.
  build-desktop:
    name: Desktop Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install packaging dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pywebview pyinstaller
          # pyobjc es lo que permite a pywebview abrir la ventana en macOS. Sin
          # el la app se genera pero no abre, y falla en silencio.
          if [ "$RUNNER_OS" == "macOS" ]; then
            pip install pyobjc-core pyobjc-framework-Cocoa pyobjc-framework-WebKit pyobjc-framework-Quartz
          fi

      - name: Verify pyobjc imports (macOS)
        if: runner.os == 'macOS'
        run: python -c "import objc, Cocoa, WebKit; print('pyobjc OK')"

      - name: Package with PyInstaller
        run: python -m PyInstaller build_desktop.spec --noconfirm --clean

      - name: Check the bundle exists
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            test -d dist/Andromeda.app || { echo "No se genero Andromeda.app"; ls -la dist; exit 1; }
            echo "Andromeda.app generado correctamente"
          else
            test -f dist/Andromeda/Andromeda.exe || test -f dist/Andromeda.exe || { echo "No se genero el ejecutable"; ls -la dist; exit 1; }
            echo "Ejecutable generado correctamente"
          fi

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [test-backend, lint, build-frontend, k8s-validate, security, build-desktop]
    if: always()

    steps:
      - name: Report
        run: |
          echo "Backend tests: ${{ needs.test-backend.result }}"
          echo "Lint:          ${{ needs.lint.result }}"
          echo "Frontend:      ${{ needs.build-frontend.result }}"
          echo "K8s manifests: ${{ needs.k8s-validate.result }}"
          echo "Security:      ${{ needs.security.result }}"
          echo "Desktop build: ${{ needs.build-desktop.result }}"

          # El empaquetado de escritorio es el producto principal: si falla, el
          # CI debe fallar aunque todo lo demás esté en verde.
          if [ "${{ needs.test-backend.result }}" != "success" ] || \
             [ "${{ needs.build-desktop.result }}" != "success" ]; then
            echo "::error::Fallo en tests o en el empaquetado de escritorio"
            exit 1
          fi
