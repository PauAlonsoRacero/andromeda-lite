# Catálogo de conectores MCP (solo lectura; el estado de cada usuario vive en
# <datos>/mcp_state.json). Depurado en la 1.1: fuera los que duplican funciones de
# Andromeda (archivos, lectura de webs, fecha, memoria), los de prueba, los que
# confunden a modelos locales, los archivados por sus autores y WhatsApp (no oficial).
servers:
  git:
    label: Git
    enabled: false
    description: 'Operar sobre repositorios Git locales: estado, log, diff, commits y ramas.'
    command:
    - uvx
    - mcp-server-git
    - --repository
    - ${ANDROMEDA_WORKSPACE}
    install: uvx mcp-server-git
    runtime: python
    requires_key: []
    env:
      ANDROMEDA_WORKSPACE: ${ANDROMEDA_WORKSPACE}
    docs: https://github.com/modelcontextprotocol/servers/tree/main/src/git
  playwright:
    label: Navegador (Playwright)
    enabled: false
    description: 'Automatizar un navegador moderno: navegar, rellenar formularios y extraer contenido.'
    command:
    - npx
    - -y
    - '@playwright/mcp@latest'
    install: npx -y @playwright/mcp@latest
    runtime: node
    requires_key: []
    docs: https://github.com/microsoft/playwright-mcp
  pandoc:
    label: Conversión de documentos
    enabled: false
    description: 'Convertir documentos entre formatos: markdown, HTML, docx, PDF y más.'
    command:
    - uvx
    - mcp-pandoc
    install: uvx mcp-pandoc
    runtime: python
    requires_key: []
    docs: https://github.com/vivekVells/mcp-pandoc
  notion:
    label: Notion
    enabled: false
    description: Leer, buscar y crear páginas y bases de datos en Notion.
    command:
    - npx
    - -y
    - '@notionhq/notion-mcp-server'
    install: npx -y @notionhq/notion-mcp-server
    runtime: node
    requires_key:
    - NOTION_API_KEY
    env:
      NOTION_API_KEY: ${NOTION_API_KEY}
    docs: https://github.com/makenotion/notion-mcp-server
  linear:
    label: Linear
    enabled: false
    description: Issues, proyectos y ciclos de desarrollo en Linear.
    command:
    - npx
    - -y
    - mcp-remote
    - https://mcp.linear.app/sse
    install: npx -y mcp-remote
    runtime: node
    requires_key: []
    docs: https://linear.app/docs/mcp
  figma:
    label: Figma
    enabled: false
    description: Leer archivos, componentes y tokens de diseño desde Figma.
    command:
    - npx
    - -y
    - figma-developer-mcp
    - --stdio
    install: npx -y figma-developer-mcp
    runtime: node
    requires_key:
    - FIGMA_API_KEY
    env:
      FIGMA_API_KEY: ${FIGMA_API_KEY}
    docs: https://github.com/GLips/Figma-Context-MCP
  obsidian:
    label: Obsidian
    enabled: false
    description: Leer y buscar notas en tu bóveda local de Obsidian.
    command:
    - uvx
    - mcp-obsidian
    install: uvx mcp-obsidian
    runtime: python
    requires_key:
    - OBSIDIAN_API_KEY
    env:
      OBSIDIAN_API_KEY: ${OBSIDIAN_API_KEY}
      OBSIDIAN_HOST: ${OBSIDIAN_HOST}
    docs: https://github.com/MarkusPfundstein/mcp-obsidian
  aws:
    label: AWS
    enabled: false
    description: Consultar documentación y recursos de AWS desde el chat.
    command:
    - uvx
    - awslabs.aws-documentation-mcp-server@latest
    install: uvx awslabs.aws-documentation-mcp-server@latest
    runtime: python
    requires_key: []
    docs: https://github.com/awslabs/mcp
  gmail:
    label: Gmail
    enabled: false
    description: 'Leer, buscar, redactar y enviar correos de Gmail, y gestionar etiquetas. Configuración previa (una vez): crea credenciales OAuth de "aplicación de escritorio" en Google Cloud, guárdalas
      como ~/.gmail-mcp/gcp-oauth.keys.json y ejecuta en una terminal: npx @artymclabin/gmail-mcp auth'
    command:
    - npx
    - -y
    - '@artymclabin/gmail-mcp'
    install: npx -y @artymclabin/gmail-mcp
    runtime: node
    requires_key: []
    setup: manual
    docs: https://github.com/ArtyMcLabin/Gmail-MCP-Server
  google-calendar:
    label: Google Calendar
    enabled: false
    description: Ver, crear y modificar eventos de tus calendarios de Google y buscar huecos libres. Necesita la ruta a tus credenciales OAuth de Google Cloud (gcp-oauth.keys.json).
    command:
    - npx
    - -y
    - '@cocal/google-calendar-mcp'
    install: npx -y @cocal/google-calendar-mcp
    runtime: node
    requires_key:
    - GOOGLE_OAUTH_CREDENTIALS
    env:
      GOOGLE_OAUTH_CREDENTIALS: ${GOOGLE_OAUTH_CREDENTIALS}
    docs: https://github.com/nspady/google-calendar-mcp
